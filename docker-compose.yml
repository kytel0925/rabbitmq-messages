services:
  php.dev:
    image: kytel0925/php:8.5-debian-frankenphp-dev
    restart: unless-stopped
    volumes:
      - '.:/app'
    depends_on:
      - rabbitmq
    entrypoint: ''
    command: ['tail', '-f', '/dev/null']
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-username}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-username}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data-volume:/var/lib/rabbitmq
      - rabbitmq-log-volume:/var/log/rabbitmq

volumes:
  rabbitmq-data-volume:
    driver: local
  rabbitmq-log-volume:
    driver: local
